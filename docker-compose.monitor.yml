# Merge with docker-compose.deploy.yml. No public monitoring ports or Docker socket in the API.
services:
  backend:
    environment:
      OBSERVABILITY_DATA_DIR: /app/observability
      OBSERVABILITY_HOST_FILE: /app/host-monitor/snapshot.json
    volumes:
      - canvas-observability:/app/observability
      - /opt/hoosland-monitor:/app/host-monitor:ro
  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
      - --storage.tsdb.retention.size=5GB
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./ops/observability/canvas-alerts.yml:/etc/prometheus/canvas-alerts.yml:ro
      - canvas-prometheus:/prometheus
    expose:
      - '9090'
    restart: unless-stopped
    mem_limit: 768m
    cpus: 0.5
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:9090/-/ready']
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  canvas-observability:
  canvas-prometheus:
