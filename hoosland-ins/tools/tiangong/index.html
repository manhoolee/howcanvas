<body>
<div class="app">
 <header class="topbar"><div class="brand"><h1>Hoosland / 天工造境</h1><span>中式仙境提示词生成器</span></div><div class="top-actions"><button class="btn" id="randomBtn">随机组合</button><button class="btn danger" id="resetBtn">重置</button></div></header>
 <main class="layout">
  <section class="panel builder">
   <div class="toolbar">
    <div class="control"><label for="medium">成片媒介</label><select id="medium" class="native-select"><option>真人实拍质感的中国神话电影剧照</option><option>电影级东方幻想概念镜头</option><option>写实国风影视美术设定</option><option>高精度东方建筑摄影</option><option value="custom">自定义…</option></select><input id="mediumCustom" class="native-custom" placeholder="输入自定义成片媒介"></div>
    <div class="control"><label for="ratio">画幅</label><select id="ratio" class="native-select"><option>16:9 横屏</option><option>21:9 超宽银幕</option><option>3:2 横构图</option><option>4:5 竖构图</option><option>9:16 竖屏</option><option value="custom">自定义…</option></select><input id="ratioCustom" class="native-custom" placeholder="输入自定义画幅"></div>
    <div class="control"><label for="density">细节密度</label><select id="density" class="native-select"><option value="balanced">均衡</option><option value="concise">精简</option><option value="rich">丰富</option></select></div>
   </div>
   <div class="presets" id="presets"></div>
   <div class="field-groups" id="fieldGroups"></div>
  </section>
  <div class="right-column">
   <aside class="panel output">
    <div class="output-head"><h2>提示词生成结果</h2><span class="metric" id="updatedAt">实时更新</span></div>
    <div class="output-body">
     <div class="result-block"><div class="result-label"><span>正向提示词</span><button class="icon-btn" data-copy="positive">复制</button></div><textarea class="result" id="positive" spellcheck="false"></textarea></div>
     <div class="result-block"><div class="result-label"><span>负面提示词</span><button class="icon-btn" data-copy="negative">复制</button></div><textarea class="result negative" id="negative" spellcheck="false"></textarea></div>
     <div class="result-block"><div class="result-label"><span>系统修正稿 · 正向提示词</span><button class="icon-btn" data-copy="correctedPositive">复制</button></div><textarea class="result" id="correctedPositive" spellcheck="false" readonly></textarea></div>
     <div class="result-block"><div class="result-label"><span>系统修正稿 · 负面提示词</span><button class="icon-btn" data-copy="correctedNegative">复制</button></div><textarea class="result negative" id="correctedNegative" spellcheck="false" readonly></textarea></div>
     <div class="footer-actions"><button class="btn primary" id="copyAll">复制随机原文</button><button class="btn" id="copyCorrected">复制系统修正稿</button><button class="btn" id="saveTxt">下载 TXT</button></div>
    </div>
    <div class="stats"><div class="stat"><b id="selectedCount">0</b><span>已选要素</span></div><div class="stat"><b id="charCount">0</b><span>正向字数</span></div><div class="stat"><b>64</b><span>样本场景</span></div></div>
   </aside>
   <section class="panel image-panel">
    <div class="image-head"><h2>直接生图</h2><span class="metric" id="imageSizeLabel">16:9 · 1824×1024</span></div>
    <div class="image-body">
     <div class="channel-row"><span class="channel-summary" id="channelSummary">尚未配置生图渠道</span><button class="btn" id="channelBtn">生图渠道</button></div>
     <div class="setting-row"><span>清晰度</span><div class="pills" id="qualityPills"><button class="pill active" data-quality="auto">自动</button><button class="pill" data-quality="high">高</button><button class="pill" data-quality="medium">中</button><button class="pill" data-quality="low">低</button></div></div>
     <div class="setting-row"><span>画幅与分辨率</span><div class="pills" id="sizePills"><button class="pill" data-size="1:1">1:1</button><button class="pill" data-size="3:2">3:2</button><button class="pill" data-size="2:3">2:3</button><button class="pill" data-size="4:3">4:3</button><button class="pill" data-size="3:4">3:4</button><button class="pill active" data-size="16:9">16:9</button><button class="pill" data-size="9:16">9:16</button><button class="pill" data-size="2048x2048">1:1 (2K)</button><button class="pill" data-size="2048x1152">16:9 (2K)</button><button class="pill" data-size="1152x2048">9:16 (2K)</button><button class="pill" data-size="3840x2160">16:9 (4K)</button><button class="pill" data-size="2160x3840">9:16 (4K)</button></div></div>
     <div class="image-actions"><button class="btn" id="generateImage">用随机原文生图</button><button class="btn primary" id="generateCorrectedImage">用系统修正稿生图</button></div>
     <div class="image-status" id="imageStatus">请填写 API Key 后开始生成</div><div class="image-status-log" id="imageStatusLog" aria-live="polite"></div>
     <div class="image-gallery" id="imageGallery"><div class="image-card" id="imageEmpty">生成的图片将显示在这里</div></div>
     <p class="secure-note">接口遵循 OpenAI 兼容图片生成规范。Key 仅保存在当前浏览器会话中，并由浏览器直接发送至所配渠道；请只使用个人、可撤销的渠道凭证。</p>
    </div>
   </section>
  </div>
 </main>
</div><div class="toast" id="toast"></div>
<dialog class="channel-dialog" id="channelDialog">
 <div class="dialog-head"><h3>生图渠道</h3><button class="icon-btn" id="closeChannelDialog" aria-label="关闭">关闭</button></div>
 <form class="dialog-body" id="channelForm">
  <label class="control"><span>Base URL</span><input class="image-input" id="imageBaseUrl" value="https://api.openai.com" placeholder="https://api.openai.com" autocomplete="url"></label>
  <label class="control"><span>模型名称</span><input class="image-input" id="imageModel" value="gpt-image-2" autocomplete="off"></label>
  <label class="control"><span>API Key</span><input class="image-input" id="imageKey" type="password" placeholder="仅在本次会话中保留" autocomplete="off"></label>
 </form>
 <div class="dialog-actions"><button class="btn danger" id="clearImageKey">清除 Key</button><div class="right"><button class="btn" id="cancelChannel">取消</button><button class="btn primary" id="saveChannel">保存</button></div></div>
</dialog>
<dialog class="preview-dialog" id="imagePreviewDialog"><div class="dialog-head"><h3>图片预览</h3><button class="icon-btn" id="closeImagePreview" aria-label="关闭预览">关闭</button></div><img class="preview-image" id="previewImage" alt="生成结果放大预览"></dialog>

function toast(t){const el=document.querySelector('#toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1400)}
init();
</script>
