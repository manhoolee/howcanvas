server {
    listen 80 default_server;
    server_name hoosland.com www.hoosland.com _;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $landing_upstream landing:80;
    set $backend_upstream backend:8787;
    location = /api/landing/visits {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /course/api/notes {
        proxy_pass http://172.19.0.1:2987/api/notes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /course/ {
        proxy_pass http://172.19.0.1:2987/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20m;
    }

    location / {
        proxy_pass http://$landing_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name can.hoosland.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8787;
    set $app_upstream app:3000;

    client_max_body_size 128m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' blob: https://esm.sh https://www.googletagmanager.com https://hm.baidu.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data: https:; connect-src 'self' data: blob: https: http://127.0.0.1:*; frame-src 'self' data: blob:; worker-src 'self' blob:" always;

    location = /api/session/events {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/image-tasks/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
    }

    # AI Responses/SSE must reach the browser incrementally; do not buffer or cache it.
    location /api/ai/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_buffering off;
        proxy_cache off;
        proxy_max_temp_file_size 0;
    }

    location /api/ {
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
    }

    location / {
        proxy_pass http://$app_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name cou.hoosland.com;

    return 301 http://ins.hoosland.com/course/;
}

server {
    listen 80;
    server_name ins.hoosland.com;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ins_upstream ins:80;

    location = /tools/real-estate {
        return 308 /tools/real-estate/;
    }

    location = /tools/real-estate/mcp {
        return 404;
    }

    location ^~ /tools/real-estate/mcp/ {
        return 404;
    }

    location /tools/real-estate/ {
        client_max_body_size 30m;
        limit_req zone=real_estate_messages burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://172.19.0.1:13090/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tools/real-estate;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_cookie_path /api/admin /tools/real-estate/api/admin;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /tools/real-estate-2 {
        return 308 /tools/real-estate-2/;
    }

    location = /tools/real-estate-2/mcp {
        return 404;
    }

    location ^~ /tools/real-estate-2/mcp/ {
        return 404;
    }

    location /tools/real-estate-2/ {
        client_max_body_size 30m;
        limit_req zone=real_estate_2_messages burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://172.19.0.1:13091/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /tools/real-estate-2;
        proxy_set_header Connection "";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_cookie_path /api/admin /tools/real-estate-2/api/admin;
        proxy_redirect off;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location = /api/notes {
        proxy_pass http://172.19.0.1:2987/api/notes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://$ins_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
