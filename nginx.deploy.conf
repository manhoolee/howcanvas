map "$request_method:$uri" $real_estate_message_rate_key {
    default "";
    ~^POST:/tools/real-estate/api/conversations/[^/]+/messages$ $binary_remote_addr;
}

map "$request_method:$uri" $real_estate_2_message_rate_key {
    default "";
    ~^POST:/tools/real-estate-2/api/conversations/[^/]+/messages$ $binary_remote_addr;
}

limit_req_zone $real_estate_message_rate_key zone=real_estate_messages:10m rate=4r/m;
limit_req_zone $real_estate_2_message_rate_key zone=real_estate_2_messages:10m rate=4r/m;

server {
    listen 80;
    server_name owui.hoosland.com;

    client_max_body_size 512m;

    location / {
        proxy_pass http://172.19.0.1:9394;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_buffering off;
    }
}

server {
    listen 80;
    server_name ai.hoosland.com;

    client_max_body_size 512m;

    location / {
        proxy_pass http://172.19.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 20m;
        proxy_send_timeout 20m;
        proxy_buffering off;
    }
}

